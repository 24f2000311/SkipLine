openapi: 3.0.3
info:
  title: SkipLine API
  description: API documentation for the SkipLine backend.
  version: 1.0.0

servers:
  - url: /api/v1
    description: V1 API routes
  - url: /health
    description: Health endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    customerToken:
      type: http
      scheme: bearer
      description: Customer anonymous access token

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        createdAt:
          type: string
          format: date-time

    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizerId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, SCHEDULED, LIVE, COMPLETED, CANCELLED]
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true

    Queue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [OPEN, PAUSED, CLOSED]
        maxCapacity:
          type: integer
        priorityPolicy:
          type: string
          enum: [FIFO, WEIGHTED_PRIORITY]

    QueueEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        queueId:
          type: string
          format: uuid
        status:
          type: string
          enum: [WAITING, CALLED, SERVING, COMPLETED, CANCELLED, SKIPPED]
        sequenceNumber:
          type: integer
        priority:
          type: string
          enum: [NORMAL, VIP]
        customerName:
          type: string
          nullable: true
        customerPhone:
          type: string
          nullable: true
        joinedAt:
          type: string
          format: date-time
        calledAt:
          type: string
          format: date-time
          nullable: true
        servedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        noShowCount:
          type: integer

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      summary: Register a new organizer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                password:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
      responses:
        '201':
          description: Registration successful
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Organizer login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh access token
      security: []
      responses:
        '200':
          description: Token refreshed
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Organizer logout
      responses:
        '200':
          description: Logout successful

  /auth/me:
    get:
      summary: Get current organizer profile
      responses:
        '200':
          description: Organizer profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events:
    get:
      summary: Get all events for the organizer
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
    post:
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [DRAFT, SCHEDULED, LIVE, COMPLETED, CANCELLED]
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Event'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events/{id}:
    get:
      summary: Get a specific event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [DRAFT, SCHEDULED, LIVE, COMPLETED, CANCELLED]
      responses:
        '200':
          description: Event updated
        '400':
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
    delete:
      summary: Delete or cancel an event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event deleted
        '404':
          description: Event not found

  /queues:
    post:
      summary: Create a new queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, name]
              properties:
                eventId:
                  type: string
                name:
                  type: string
                maxCapacity:
                  type: integer
                priorityPolicy:
                  type: string
      responses:
        '201':
          description: Queue created
        '400':
          description: Validation error

  /events/{eventId}/queues:
    get:
      summary: Get queues for an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of queues
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Queue'

  /queues/{id}:
    get:
      summary: Get queue details (Organizer)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue details
    put:
      summary: Update a queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                maxCapacity:
                  type: integer
      responses:
        '200':
          description: Queue updated
    delete:
      summary: Delete a queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue deleted

  /queues/{id}/public:
    get:
      summary: Get public queue details
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public queue state

  /queues/{queueId}/entries:
    get:
      summary: Get active entries for a queue (Organizer)
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of entries
    post:
      summary: Join a queue (Customer)
      security: []
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                customerName:
                  type: string
                customerPhone:
                  type: string
      responses:
        '201':
          description: Joined queue successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      entry:
                        $ref: '#/components/schemas/QueueEntry'
                      accessToken:
                        type: string
        '400':
          description: Queue full or closed

  /queue-entries/session/{sessionId}:
    get:
      summary: Get active entries by session
      security: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of active customer entries

  /queue-entries/{id}:
    get:
      summary: Get customer entry status
      security:
        - customerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entry status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/QueueEntry'
        '403':
          description: Unauthorized

  /queue-entries/{id}/leave:
    post:
      summary: Customer leaves the queue
      security:
        - customerToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully left queue

  /queues/{queueId}/call-next:
    post:
      summary: Call next customer in queue
      parameters:
        - name: queueId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer called
        '404':
          description: No waiting customers

  /queue-entries/{id}/start:
    post:
      summary: Start serving a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Started serving

  /queue-entries/{id}/no-show:
    post:
      summary: Mark customer as no-show
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: No-show recorded

  /queue-entries/{id}/complete:
    post:
      summary: Complete customer service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service completed

  /live:
    get:
      summary: Process liveness check
      security: []
      responses:
        '200':
          description: Process is alive

  /ready:
    get:
      summary: Database readiness check
      security: []
      responses:
        '200':
          description: Database is reachable
        '503':
          description: Database is unreachable
